name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

# Superseded PR checks can stop; a running production publish must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow syntax and security
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
          pipx run --spec zizmor==1.30.1 zizmor --offline --pedantic .github/workflows

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Install browser for production audio cache check
        run: npx playwright install --with-deps chromium
      - name: Verify lazy audio caching in the production build
        run: npm run test:audio-cache

      # Upload only after every check passes; deployment never rebuilds dist.
      - name: Upload verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Publish the checked artifact to the gh-pages branch.
    steps:
      # Concurrency does not promise ordering. Do not publish an obsolete push.
      - name: Check that this is still the current master revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment of a superseded master revision.'
          fi

      - name: Download verified production build
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-files
          path: dist/

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: dist/
          commit_message: Deploy verified build
