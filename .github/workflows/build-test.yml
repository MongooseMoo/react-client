name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

# Superseded PR checks can stop; a running production publish must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow syntax and security
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
          pipx run --spec zizmor==1.30.1 zizmor --offline --pedantic .github/workflows

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Install browser for production audio cache check
        run: npx playwright install --with-deps chromium
      - name: Verify editor ownership across game sessions
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5183
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5183 --strictPort > /tmp/editor-vite.log 2>&1 &
          editor_server_pid=$!
          trap 'kill "$editor_server_pid"' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/src/EditorManager.ts" > /dev/null; then
              break
            fi
            sleep 1
          done
          node node_modules/@playwright/test/cli.js test tests/browser/editor-ownership.spec.ts --workers=1 --reporter=line
      - name: Verify lazy audio caching in the production build
        run: npm run test:audio-cache
      - name: Verify browser session ownership and visitor privacy in the production build
        run: node scripts/check-browser-sessions.mjs
      - name: Verify keyboard accessibility in the production build
        run: npm run test:a11y

      # Upload only after every check passes; deployment never rebuilds dist.
      - name: Upload verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Publish the checked artifact to the gh-pages branch.
    steps:
      # Concurrency does not promise ordering. Do not publish an obsolete push.
      - name: Check that this is still the current master revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment of a superseded master revision.'
          fi

      - name: Download verified production build
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-files
          path: dist/

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: dist/
          commit_message: Deploy verified build
